[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-identity-platform"
version = "0.1.0"
description = "Identity resolution and Customer 360: probabilistic matching with stable person IDs, data contracts, privacy-safe erasure, and a Delta Lake export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Duan Nguyen" }]
dependencies = [
  "duckdb>=1.1",
  "splink>=4.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "rapidfuzz>=3",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "deltalake>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.6", "dbt-duckdb>=1.8"]

[project.scripts]
cip = "cip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: end-to-end tests that run the full pipeline"]

[tool.ruff.lint.per-file-ignores]
"databricks/*" = ["F821", "E501", "E402"]  # notebook globals: spark, dbutils, display
