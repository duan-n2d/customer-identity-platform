source: ecom
description: E-commerce accounts. An email is required to create an account.
owner: digital-commerce
primary_key: account_id
columns:
  account_id:   {type: string, nullable: false}
  full_name:    {type: string, nullable: false}
  email:        {type: string, nullable: false}
  phone:        {type: string, nullable: true, max_null_rate: 0.65}
  created_date: {type: date,   nullable: false}
  ingested_at:  {type: timestamp, nullable: false}
freshness:
  max_lag_days: 2
volume:
  min_ratio_vs_median: 0.1
  max_ratio_vs_median: 10
